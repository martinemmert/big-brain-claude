name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ubuntu-22.04: its glibc (2.35) keeps the binaries running on older distributions.
  linux:
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GPUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake clang \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev \
            libssl-dev libzstd-dev libasound2-dev
      - run: cargo test -p brain-core

      - name: Package
        run: |
          ./scripts/package-linux.sh
          archive="$(ls dist/brain-*-linux-*.tar.gz)"
          case "$archive" in
            "dist/brain-${GITHUB_REF_NAME#v}-linux-"*) ;;
            *) echo "Tag $GITHUB_REF_NAME does not match $archive" >&2; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: dist/brain-*-linux-*.tar.gz
          if-no-files-found: error

  release:
    needs: linux
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p brain-core

      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: release
          merge-multiple: true

      - name: Bundle
        run: ./scripts/bundle.sh

      - name: Package
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Brain.app/Contents/Info.plist)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          mkdir -p release
          ditto -c -k --keepParent dist/Brain.app "release/Brain-$version-macos-arm64.zip"
          tar -czf "release/brain-$version-macos-arm64.tar.gz" -C dist brain
          cp dist/Brain.alfredworkflow release/
          (cd release && shasum -a 256 *.zip *.tar.gz *.alfredworkflow > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          With Homebrew (installs `Brain.app` and the `brain` CLI):

          ```sh
          brew tap martinemmert/big-brain-claude https://github.com/martinemmert/big-brain-claude
          brew install --cask brain
          brain install
          ```

          Or by hand:

          1. Download `Brain-*-macos-arm64.zip` and `brain-*-macos-arm64.tar.gz` (Apple Silicon).
          2. Unzip and move `Brain.app` to `/Applications`.
          3. The app is only ad-hoc signed, not notarized: open it the first time via
             right-click → Open (macOS 15: System Settings → Privacy & Security → Open Anyway),
             or run `xattr -dr com.apple.quarantine /Applications/Brain.app`.
          4. Unpack `brain`, put it on your `PATH` (e.g. `~/.cargo/bin`) and run `brain install`.
             If macOS blocks it, run `xattr -d com.apple.quarantine brain` first.

          **Linux** (x86_64 or aarch64, glibc 2.35+):

          ```sh
          tar -xzf brain-*-linux-$(uname -m).tar.gz
          ./brain-*-linux-$(uname -m)/install.sh
          ```

          It installs `brain` and `brain-app` to `~/.local/bin`, adds Brain to the app
          launcher and runs `brain install`.

          **Alfred:** double-click `Brain.alfredworkflow`. Keyword `cc`; ⏎ opens the session's
          terminal, ⌥⏎ shows it in Brain.

          `SHA256SUMS.txt` lists the checksums.
          NOTES
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Brain $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes

      # Points Casks/brain.rb at the new release. Pushes made with GITHUB_TOKEN start no
      # workflow runs, and releases only run for v* tags, so this cannot loop.
      - name: Update the Homebrew cask
        run: |
          sha256="$(shasum -a 256 "release/Brain-$version-macos-arm64.zip" | cut -d ' ' -f 1)"
          # The job runs on the tag; commit on top of the current main.
          git fetch --depth 1 origin main
          git checkout -B main FETCH_HEAD
          sed -i '' -E \
            -e "s/^  version \"[^\"]*\"$/  version \"$version\"/" \
            -e "s/^  sha256 \"[^\"]*\"$/  sha256 \"$sha256\"/" \
            Casks/brain.rb
          grep -q "^  version \"$version\"$" Casks/brain.rb
          grep -q "^  sha256 \"$sha256\"$" Casks/brain.rb
          if git diff --quiet; then
            echo "Casks/brain.rb is already at $version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cask: brain $version" Casks/brain.rb
          git push origin main

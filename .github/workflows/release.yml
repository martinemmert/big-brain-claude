name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p brain-core

      - name: Bundle
        run: ./scripts/bundle.sh

      - name: Package
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Brain.app/Contents/Info.plist)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi
          mkdir release
          ditto -c -k --keepParent dist/Brain.app "release/Brain-$version-macos-arm64.zip"
          tar -czf "release/brain-$version-macos-arm64.tar.gz" -C dist brain
          (cd release && shasum -a 256 *.zip *.tar.gz > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          1. Download `Brain-*-macos-arm64.zip` and `brain-*-macos-arm64.tar.gz` (Apple Silicon).
          2. Unzip and move `Brain.app` to `/Applications`.
          3. The app is only ad-hoc signed, not notarized: open it the first time via
             right-click → Open (macOS 15: System Settings → Privacy & Security → Open Anyway),
             or run `xattr -dr com.apple.quarantine /Applications/Brain.app`.
          4. Unpack `brain`, put it on your `PATH` (e.g. `~/.cargo/bin`) and run `brain install`.
             If macOS blocks it, run `xattr -d com.apple.quarantine brain` first.

          `SHA256SUMS.txt` lists the checksums.
          NOTES
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Brain $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes

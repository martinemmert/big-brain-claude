[workspace]
resolver = "2"
members = ["crates/brain-core", "crates/brain-terminal", "crates/brain-cli", "crates/brain-app"]

[workspace.package]
edition = "2021"
version = "0.6.0"

[workspace.dependencies]
brain-core = { path = "crates/brain-core" }
brain-terminal = { path = "crates/brain-terminal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

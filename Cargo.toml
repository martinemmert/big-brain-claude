[workspace]
resolver = "2"
members = ["crates/brain-core", "crates/brain-terminal", "crates/brain-cli", "crates/brain-app", "crates/iced-term"]

[workspace.package]
edition = "2021"
version = "0.10.3"

[workspace.dependencies]
brain-core = { path = "crates/brain-core" }
brain-terminal = { path = "crates/brain-terminal" }
serde = { version = "1", features = ["derive"] }
# Keeps the order of keys in the settings Brain rewrites (sync, install).
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
